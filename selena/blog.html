<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog &mdash; Salt Spring Rolfing</title>
  <meta name="description" content="Learn about Rolfing, fascia, body patterns, and more from Selena La Brooy.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style2.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="container">
      <a href="index.html" class="logo"><img src="images/logo-light.webp" alt="Salt Spring Rolfing" class="logo-light"><img src="images/logo-dark.webp" alt="Salt Spring Rolfing" class="logo-dark"></a>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav>
        <a href="about-sessions.html">About Sessions</a>
        <a href="about-selena.html">About Selena</a>
        <a href="faqs.html">FAQs</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
        <a href="https://www.facebook.com/profile.php?id=100064133013122" target="_blank" rel="noopener" class="nav-social" aria-label="Facebook">
          <svg viewBox="0 0 64 64" width="20" height="20"><path fill="currentColor" d="M34.1,47V33.3h4.6l0.7-5.3h-5.3v-3.4c0-1.5,0.4-2.6,2.6-2.6l2.8,0v-4.8c-0.5-0.1-2.2-0.2-4.1-0.2 c-4.1,0-6.9,2.5-6.9,7V28H24v5.3h4.6V47H34.1z"/></svg>
        </a>
        <a href="booking.html" class="btn-book">Book A Session</a>
      </nav>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero parallax-bg hero-short" style="background-image: url('images/blog-hero.jpg');">
    <div class="hero-content">
      <h1>Blog</h1>
      <p>Learn about Rolfing&#8482;</p>
    </div>
  </section>
  <div class="hero-spacer"></div>

  <!-- BLOG GRID -->
  <section>
    <div class="container">
      <div class="blog-grid" id="blog-list">
        <!-- Rendered by site.js from content/blog-posts.json -->
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <div class="logo-footer"><img src="images/logo-dark.webp" alt="Salt Spring Rolfing"></div>
      <div class="footer-address">
        <p>Our Clinic is located at<br>Unit 5 - 127 Rainbow Road, Salt Spring Island, BC</p>
      </div>
      <div class="footer-cta">
        <a href="booking.html" class="btn">Book A Session</a>
      </div>
    </div>
    <nav class="footer-nav">
      <a href="about-sessions.html">About Sessions</a>
      <a href="about-selena.html">About Selena</a>
      <a href="faqs.html">FAQs</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="booking.html">Book A Session</a>
    </nav>
  </footer>

  <script>
    var header = document.querySelector('header');
    function checkScroll() {
      if (window.scrollY > 50) header.classList.add('scrolled');
      else header.classList.remove('scrolled');
    }
    window.addEventListener('scroll', checkScroll);
    checkScroll();
    document.querySelector('.nav-toggle').addEventListener('click', function() {
      document.querySelector('nav').classList.toggle('active');
      document.querySelector('header').classList.toggle('nav-open');
    });
    document.querySelectorAll('nav a').forEach(function(link) {
      link.addEventListener('click', function() {
        document.querySelector('nav').classList.remove('active');
        document.querySelector('header').classList.remove('nav-open');
      });
    });

    // Hero drift
    window.addEventListener('scroll', function() {
      var hero = document.querySelector('.hero');
      if (hero) {
        hero.style.backgroundPositionY = (40 + window.scrollY * 0.02) + '%';
      }
    });
  </script>
  <script src="js/site.js"></script>
</body>
</html>
