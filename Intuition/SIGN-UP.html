<style>
  /* SIGN-UP.html (Piet 10-22): one screen, no scroll, no footage. INTUITION forms in its spot at the top and stays
     (10vh; left on a computer as on the first screen, centred on a phone as there), 84% of the main page's size; the
     Join Mailing List card under it comes in with it. */
  .signup .shot-title { top: 10vh; bottom: auto; }
  .signup .wordmark,
  .signup .intro-word { font-size: 2.9232vw; }                      /* the opening's unit: 3.48vw x 21/25 */
  .signup .wordmark svg,
  .signup .intro-word svg { width: 21vw; }                           /* 25vw on the main page */
  .signup .intro-word { left: 14.5vw; top: calc(10vh + 1.242vw); }   /* centred on the word's spot: 4vw + 21vw / 2; 2.484vw tall */
  .signup .card-join {
    position: absolute;
    inset: 0;
    z-index: 3;
    padding-top: calc(10vh + 2.484vw + 6vh);   /* clear of the word: 21vw wide = 2.484vw tall */
    padding-bottom: calc(8vh + 1.15 * clamp(1rem, 2vw, 3.125rem));   /* clear of the logline: 4vh up, one line */
    overflow-y: auto;                           /* only if a very short screen cannot hold it */
  }
  /* The logline at the bottom, centred, 4vh up (where the phone's logos sit on the main page), in index.html's
     .quote p type */
  .signup .logline {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 4vh;
    padding: 0 var(--gutter);
    font-family: var(--quote);
    font-weight: 300;
    font-size: clamp(1rem, 2vw, 3.125rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-align: center;
    text-align-last: center;
    hyphens: manual;
    text-wrap: balance;
  }
  .signup-form .button:disabled { cursor: default; opacity: 1; }
  /* the opening never finished (16 s): the form shows anyway */
  .gave-up .card-join .drift { --in: 1; pointer-events: auto; }
  @media (max-width: 700px) {
    .signup .shot-title { display: flex; justify-content: center; }
    .signup .wordmark,
    .signup .intro-word { font-size: 10.8576vw; }                    /* 12.8064vw x 78/92 */
    .signup .wordmark svg,
    .signup .intro-word svg { width: 78vw; }                         /* 92vw on the main page */
    .signup .intro-word { left: 50%; top: calc(10vh + 4.613vw); }    /* 78vw wide = 9.226vw tall */
    .signup .card-join { padding-top: calc(10vh + 9.226vw + 4vh); padding-bottom: calc(7vh + 2.875rem); }   /* logline: two lines */
    .signup .logline { font-size: 1.25rem; }                        /* the main page's phone quotes */
  }
</style>
<script>
  document.documentElement.classList.add('js', 'intro');
  window.introGuard = setTimeout(function () { var r = document.documentElement; r.classList.remove('intro'); r.classList.add('gave-up'); }, 16000);</script>

<body class="signup">

<main id="page">
  <div class="stage">

        <h1 class="wordmark"><svg viewBox="91.90 91.74 608.81 72.01" role="img" aria-label="INTUITION"><path style="--k: 0" d="M97.82,92.75h2.23c.47,0,.85.38.85.85v68.3c0,.47-.38.85-.85.85h-3.15c-2.76,0-5-2.24-5-5v-59.08c0-3.27,2.65-5.92,5.92-5.92Z"/><path style="--k: 1" d="M190.4,92.75c.77,0,1.4.63,1.4,1.4v68.87c0,.39-.33.72-.75.72-.55,0-3.31-.08-3.93-.08-2.53,0-3.68-.83-4.18-2.47-1.68-5.55-21.27-37.72-36.83-47.77-.87-.92-2.42-.31-2.42.96v46.97c0,.77-.63,1.4-1.4,1.4h-6.1c-.77,0-1.4-.63-1.4-1.4v-68.55c0-.58.47-1.06,1.06-1.06h6.04c.69,0,1.3.47,1.44,1.14,2.66,12.48,16.84,16.14,37.04,46.2.87.92,2.42.31,2.42-.96v-39.89c0-3.03,2.46-5.49,5.49-5.49h2.11Z"/><path style="--k: 2" d="M249,102.25v58.84c0,.92-.75,1.66-1.66,1.66h-.47c-3.79,0-6.87-3.07-6.87-6.87v-53.64c0-.5-.4-.9-.9-.9h-17.98c-.88,0-1.57-.74-1.51-1.62l.39-5.58c.06-.79.71-1.41,1.51-1.41h43.31c2.24,0,4.1,1.73,4.25,3.97l.26,3.67c.04.52-.37.96-.89.96h-18.54c-.5,0-.9.4-.9.9Z"/><path style="--k: 3" d="M297.59,92.75h7.01c.55,0,.99.44.99.99v40.61c0,13.5,7.8,20.4,18.8,20.4s18.9-6.9,18.9-20.4v-38.19c0-1.89,1.53-3.42,3.42-3.42h4.49c.55,0,.99.44.99.99v41.31c0,18.2-10.4,28.7-27.8,28.7s-27.8-10.5-27.8-28.7v-41.31c0-.55.44-.99.99-.99Z"/><path style="--k: 4" d="M391.61,92.75h1.51c.76,0,1.38.62,1.38,1.38v62.99c0,3.12-2.53,5.64-5.64,5.64h-1.41c-1.07,0-1.94-.87-1.94-1.94v-61.95c0-3.38,2.74-6.11,6.11-6.11Z"/><path style="--k: 5" d="M451.7,102.16v53.56c0,3.89-3.15,7.04-7.04,7.04h-.3c-.92,0-1.67-.75-1.67-1.67v-58.93c0-.45-.36-.81-.81-.81h-18.82c-.47,0-.84-.4-.81-.87l.3-4.28c.14-1.95,1.75-3.46,3.71-3.46h43.57c.94,0,1.72.73,1.79,1.67l.35,5.01c.07,1.04-.75,1.92-1.79,1.92h-17.67c-.45,0-.81.36-.81.81Z"/><path style="--k: 6" d="M501.63,92.75h1.24c3.39,0,6.13,2.75,6.13,6.13v62.56c0,.73-.59,1.32-1.32,1.32h-1.55c-3.39,0-6.13-2.75-6.13-6.13v-62.24c0-.9.73-1.63,1.63-1.63Z"/><path style="--k: 7" d="M540.1,127.75c0-20,15.9-36,35.9-36s35.9,16,35.9,36-15.9,36-35.9,36-35.9-16-35.9-36ZM602.6,127.75c0-15.5-11.4-27.4-26.6-27.4s-26.7,11.9-26.7,27.4,11.4,2 <script>
  // The mailing list (Piet 10-22): Cloudflare worker intuition-mailing (~/Documents/.fix2/intuition-mailing) into the
  // D1 table signups. Signed up: the button reads SIGNED UP and stops taking clicks, and Piet's line shows under it.
  // If it does not go through the button comes back as it was.
  (function () {
    var form = document.querySelector('.signup-form'), button = form.querySelector('button'), thanks = form.querySelector('.form-thanks');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      var f = form.elements;
      fetch('https://intuition-mailing.intuitionfilm.workers.dev/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fname: f.fname.value, lname: f.lname.value, email: f.email.value, note: f.note.value })
      }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        button.textContent = 'SIGNED UP';
        thanks.hidden = false;
      }).catch(function () { button.disabled = false; });
    });
  })();

  (function () {
    var root = document.documentElement;
    var stage = document.querySelector('.stage');
    var shot = stage.querySelector('.shot-footage');
    var mark = stage.querySelector('.wordmark');
    var videoReady = false;
    function ramp(x, a, b) { return b <= a ? (x >= a ? 1 : 0) : Math.min(1, Math.max(0, (x - a) / (b - a))); }
    function ease(t) { return t * t * (3 - 2 * t); }
    // The card comes in with the word (Piet 10-22: at the same time), 400 ms in: the heading, then the form 240 ms
    // behind, each drifting up over 1 s (the main page's 25vh in, 6vh apart, on a clock)
    var drift = [].slice.call(document.querySelectorAll('.card-join .drift')), shown = false;
    function card() {
      if (shown) return;
      shown = true;
      var t0 = 0;
      function step(now) {
        if (!t0) t0 = now;
        var going = false;
        drift.forEach(function (el, k) {
          var i = ease(ramp(now - t0, k * 240, k * 240 + 1000));
          el.style.setProperty('--in', i.toFixed(4));
          el.style.pointerEvents = i > .5 ? '' : 'none';
          if (i < 1) going = true;
        });
        if (going) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    // Opening (index.html's): on black, INTUITION assembles from soft-edged pieces of its own letters, carried in on a
    // current of small clockwise eddies under soft puffs of smoke, each piece circling its spot until it settles. Here
    // it assembles in its spot at the top (the centre word, .intro-word, sits there) and stays (Piet 10-22).
    function startVideo() { videoReady = true; }   // no footage here
    if (!root.classList.contains('intro') || !shot || !mark) {
      root.classList.remove('intro');
      card();
      return;
    }
    // The letters' own smoke (Turbulent Displace + blur in After Effects terms): the corner word sharpens through it
    // as the black lifts, and it is all there is if the pieces cannot be made
    function filter(id, seed) {
      return '<filter id="' + id + '" x="-40%" y="-300%" width="180%" height="700%" color-interpolation-filters="sRGB">' +
        '<feTurbulence type="fractalNoise" numOctaves="3" seed="' + seed + '" result="n"/>' +
        '<feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G" result="d"/>' +
        '<feGaussianBlur in="d" stdDeviation="0"/></filter>';
    }
    var holder = document.createElement('div');
    holder.innerHTML = '<svg class="fx" width="0" height="0" aria-hidden="true" focusable="false">' +
      filter('smoke-a', 3) + filter('smoke-b', 8) + '</svg>';
    var svg = holder.firstChild;
    svg.style.position = 'absolute';
    document.body.appendChild(svg);
    function parts(id) { var c = svg.querySelector('#' + id).children; return { noise: c[0], warp: c[1], blur: c[2] }; }
    var A = parts('smoke-a'), B = parts('smoke-b');
    var px = parseFloat(getComputedStyle(mark).fontSize) || 60;
    var SOFT = .03;   // in em: the blur left on everything until the black lifts
    function smoke(f, k, t, blur) {   // k: 0 = settled letters, 1 = all smoke; t (s) turns the wisps slowly; blur in px
      f.noise.setAttribute('baseFrequency',
        ((1.3 + .25 * Math.sin(t * .35)) / px).toFixed(5) + ' ' + ((.45 + .1 * Math.cos(t * .25)) / px).toFixed(5));
      f.warp.setAttribute('scale', (k * px * 2.4).toFixed(2));
      f.blur.setAttribute('stdDeviation', blur.toFixed(2));
    }
    var word = document.createElement('div');   // laid out for the letter positions; only shown if there are no pieces
    word.className = 'intro-word';
    word.setAttribute('aria-hidden', 'true');
    word.appendChild(mark.querySelector('svg').cloneNode(true));
    word.style.opacity = '0';
    word.style.filter = 'url(#smoke-a)';
    shot.appendChild(word);
    var fx = null;

    function inout(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(2 - 2 * t, 3) / 2; }
    function band(a, b, x) { var u = ramp(x, a, b); return u * u * (3 - 2 * u); }
    // ms of the opening's own time: gather at the centre 400-5400, hold, out 6400-8700, gather bottom-left
    // 8700-11700, black lifts and the word sharpens 10900-12100; all of it plays in 9 s of real time (K)
    var C0 = 400, C1 = 5400, M0 = 6400, M1 = 8900, F0 = 8700, F1 = 11700, L0 = 10900, L1 = 12100, K = L1 / 9000;
    // its clock: the first 5000 ms show the gather's 3300 to 4600 slowed down, so it is still forming; then it speeds
    // up smoothly to full speed by M0 (a cubic, so the speed never jumps); it is formed at RF
    var A0 = 3300, A1 = 5000, E1 = 4600;
    function clock(R) { return R < A1 ? A0 + R * (E1 - A0) / A1 : R < M0 ? catchUp((R - A1) / (M0 - A1)) : R; }
    function catchUp(s) {
      var m0 = (E1 - A0) / A1 * (M0 - A1), m1 = M0 - A1;   // the speed at either end, in ms per the whole stretch
      return E1 * (2 * s * s * s - 3 * s * s + 1) + m0 * (s * s * s - 2 * s * s + s) + M0 * (3 * s * s - 2 * s * s * s) +
        m1 * (s * s * s - s * s);
    }
    var RF = M0;   // found by halving
    for (var lo = A1, hi = M0, h = 0; h < 40; h++) { RF = (lo + hi) / 2; if (clock(RF) < C1) lo = RF; else hi = RF; }
    function forward(d, t) { return d + (1 - d) * (1 - (1 - t) * (1 - t)); }   // scale from d (deep) to 1 (here) as t goes 0 to 1
    function near(R) {   // the whole cloud comes forward from 95% to full size over the first A1 ms
      return R >= A1 ? 1 : forward(.95 / forward(.7, ramp(A0, C0, C1)), R / A1);
    }

    // The pieces: the word (INTUITION_WordMark.svg, in the h1) drawn off screen at its size on screen, a jittered grid of centres .15 em apart
    // (10 px at 1920 wide), and each piece = the ink times a soft round weight around its centre, the weights shared
    // out so that the pieces in place add up to the word exactly. On top, 600 large soft puffs. All of it is carried
    // by a current of about 60 separate small eddies around each word, all clockwise, each its own size (0.4 to 1.2
    // letter-heights across), turn and drift, so every zone curls differently. Each piece and puff starts apart from
    // its spot, deep (puffs drawn at 40-70% of their distance from the word's centre), and comes forward as the
    // current carries it in and a pull towards its spot grows. Each piece also circles its spot clockwise; both calm
    // down from 4000 ms to RF. The corner word gathers the same way in its own spot.
    function makeSmoke() {
      var sr = shot.getBoundingClientRect(), W = sr.width, H = sr.height;
      var dpr = Math.min(window.devicePixelRatio || 1, 2), LO = .5;   // puffs and soft pieces draw at half resolution
      function canvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
      var shape = mark.querySelector('svg'), o = word.querySelector('svg').getBoundingClientRect(), q = shape.getBoundingClientRect();   // the centre word and the corner word (the SVG's box is its ink)
      var vb = shape.getAttribute('viewBox').split(/[\s,]+/).map(Number);
      var letters = [].map.call(shape.querySelectorAll('path'), function (e) { return new Path2D(e.getAttribute('d')); });
      function drawWord(g, d) {   // the letters into g, d device px per CSS px, pad in from its corner
        var kx = o.width / vb[2] * d, ky = o.height / vb[3] * d;
        g.setTransform(kx, 0, 0, ky, pad * d - vb[0] * kx, pad * d - vb[1] * ky);
        g.fillStyle = '#fff';
        letters.forEach(function (l) { g.fill(l); });
        g.setTransform(1, 0, 0, 1, 0, 0);
      }
      // draw the word off screen and sample its ink
      var pad = Math.ceil(px * .5);
      var c = canvas(Math.ceil(o.width) + pad * 2, Math.ceil(o.height) + pad * 2), g = c.getContext('2d');
      drawWord(g, 1);
      var ink = g.getImageData(0, 0, c.width, c.height).data, pts = [], step = Math.max(1, Math.round(px / 34));
      for (var y = 0; y < c.height; y += step) {
        for (var x = 0; x < c.width; x += step) if (ink[(y * c.width + x) * 4 + 3] > 128) pts.push([x - pad, y - pad]);
      }
      if (!pts.length) return null;
      // eight lumpy puff shapes, each a cluster of nine soft blobs
      var puffs = [];
      for (var v = 0; v < 8; v++) {
        var Z = 128, pc = canvas(Z, Z), pg = pc.getContext('2d');
        for (var bl = 0; bl < 9; bl++) {
          var ba = Math.random() * 6.2832, bd = Math.random() * Z * .16, br = Z * (.16 + Math.random() * .16);
          var bx = Z / 2 + Math.cos(ba) * bd, by = Z / 2 + Math.sin(ba) * bd;
          var bg = pg.createRadialGradient(bx, by, 0, bx, by, br);
          bg.addColorStop(0, 'rgba(255,255,255,.35)');
          bg.addColorStop(1, 'rgba(255,255,255,0)');
          pg.fillStyle = bg;
          pg.fillRect(0, 0, Z, Z);
        }
        puffs.push(pc);
      }
      // the swirling current: about 60 separate eddies scattered around each word, each a soft vortex (a stream
      // function, so it only ever swirls) with its own size, turn and spin, drifting slowly; it fades out a little
      // past its edge, so neighbouring zones move differently
      function eddies(x0, y0, x1, y1, t0) {
        var E = [];
        for (var n = 0; n < 60; n++) {
          var across = (.4 + Math.random() * .8) * px, r = across / 2, x = 0, y = 0, j = 0;
          for (var tries = 0; tries < 30; tries++) {   // keep eddies from piling on top of each other
            x = x0 + Math.random() * (x1 - x0);
            y = y0 + Math.random() * (y1 - y0);
            for (j = 0; j < E.length; j++) {
              var dx = x - E[j].x, dy = y - E[j].y, s = .6 * (r + E[j].r);
              if (dx * dx + dy * dy < s * s) break;
            }
            if (j === E.length) break;
          }
          var turn = (2 + 2.5 * (across / px - .4) / .8) * (.75 + Math.random() * .5);   // 1.5-5.6, small ones quicker
          var dir = Math.random() * 6.2832, drift = (.05 + Math.random() * .1) * px;    // about 3-10 px/s at 1920 wide
          E.push({ x: x, y: y, cx: x, cy: y, t0: t0, r2: r * r, cut: 9 * r * r, r: r,
            w: 10.36 / turn * .75,   // spin at the core in rad/s, clockwise on screen (y down); .75: 2-7.5 s a turn
            vx: Math.cos(dir) * drift, vy: Math.sin(dir) * drift });
        }
        return E;
      }
      function place(E, t) {   // where each eddy has drifted to by t (s)
        for (var j = 0; j < E.length; j++) { var e = E[j], te = t - e.t0; e.cx = e.x + e.vx * te; e.cy = e.y + e.vy * te; }
      }
      var fu = 0, fv = 0;
      function flow(x, y, E) {   // the current at x, y in px/s, from the eddies near enough to matter
        fu = 0; fv = 0;
        for (var j = 0; j < E.length; j++) {
          var e = E[j], dx = x - e.cx, dy = y - e.cy, d2 = dx * dx + dy * dy;
          if (d2 > e.cut) continue;
          var g = e.w * Math.exp(-d2 / e.r2);
          fu -= g * dy;
          fv += g * dx;
        }
      }
      // the centre word's box with room for the cloud; the corner word's is the same box moved
      var wl = o.left - sr.left, wt = o.top - sr.top, wr = o.right - sr.left, wb = o.bottom - sr.top;
      var mx = px * 1.3, mu = px * 1.9, sx = q.left - o.left, sy = q.top - o.top;
      var E1 = eddies(wl - mx, wt - mu, wr + mx, wb + mx, C0 / 1000), E2 = eddies(wl - mx + sx, wt - mu + sy, wr + mx + sx, wb + mx + sy, F0 / 1000);
      var HW = (wr - wl) / 2, MX = wl + HW, MY = (wt + wb) / 2;   // half the ink's width, its centre

        var jx = pt[0] + (Math.random() - .5) * step * 1.2, jy = pt[1] + (Math.random() - .5) * step * 1.2;
        var ax = o.left - sr.left + jx, ay = o.top - sr.top + jy, s0 = near(cloud * 1.3);
        var c0 = C0 + Math.random() * 1000, f0 = F0 + Math.random() * 600;
        var size = (.6 + Math.random() * 1.35) * px;   // about 40-130 px at 1920 wide
        P.push({
          puff: true, img: puffs[n % 8],
          ax: ax, ay: ay, bx: q.left - sr.left + jx, by: q.top - sr.top + jy,   // its spot on the centre and corner word
          x: ax + s0[0], y: ay + s0[1], b0: near(cloud * 1.3), moved: false,
          deep: .4 + Math.random() * .3,                                 // how deep it starts
          c0: c0, c1: c0 + 3500 + Math.random() * 500,                   // centre gather, done by 5400
          m0: M0 + Math.random() * 500, m1: M1 - Math.random() * 300,

      }
      var ic = canvas(c.width * dpr, c.height * dpr), ig = ic.getContext('2d');

      var IW = ic.width, IH = ic.height, inked = ig.getImageData(0, 0, IW, IH).data, CUT = [], SUM = new Float32Array(IW * IH);

      for (var gy = G / 2; gy < IH; gy += G) {
        for (var gx = G / 2; gx < IW; gx += G) {
          var e = [gx + (Math.random() - .5) * .7 * G, gy + (Math.random() - .5) * .7 * G], has = false;
          e[2] = Math.round(e[0]);
          e[3] = Math.round(e[1]);

        for (var y = Math.max(0, e[3] - RW); y <= Math.min(IH - 1, e[3] + RW); y++) {

        }
      });
      CUT.forEach(function (e) {
        var pc = canvas(PN, PN), pg = pc.getContext('2d'), im = pg.createImageData(PN, PN), id = im.data;
        for (var pv = 0; pv < PN; pv++) {
          for (var pu = 0; pu < PN; pu++) {
            var x = e[2] - RW + pu, y = e[3] - RW + pv, al = x < 0 || y < 0 || x >= IW || y >= IH ? 0 : inked[(y * IW + x) * 4 + 3];
            if (!al) continue;
            var at4 = (pv * PN + pu) * 4;
            id[at4] = id[at4 + 1] = id[at4 + 2] = 255;

          }
        }
        pg.putImageData(im, 0, 0);
        var jx = (e[2] + .5) / dpr - pad, jy = (e[3] + .5) / dpr - pad;   // its centre, from the first letter's box
        var ax = o.left - sr.left + jx, ay = o.top - sr.top + jy, s0 = near(cloud), c0 = C0 + Math.random() * 1000, f0 = F0 + Math.random() * 600;
        P.push({
          piece: pc, wx: jx, wy: jy, s: PN / dpr, puff: false,   // s: its width in CSS px
          ax: ax, ay: ay, bx: q.left - sr.left + jx, by: q.top - sr.top + jy,
          x: ax + s0[0], y: ay + s0[1], b0: near(cloud), moved: false, deep: 1, keep: false,
          c0: c0, c1: c0 + 3500 + Math.random() * 500, m0: M0 + Math.random() * 500, m1: M1 - Math.random() * 300,
          f0: f0, f1: f0 + 2200 + Math.random() * 200, size: 0, al: 1
        });
      });
      // The in (Piet 10-21): the letters sit in their spots (no current) and 9 pointers nobody holds, at random spots
      // on the word, drifting 3-10 px/s, push them as the mouse does (stir): 1.5em reach, up to .18em, pushed pieces go
      // soft; full to 2 s of real time, gone by M0 as the word holds (Piet 10-21: the end was too sharp at 4000 ms to RF)
      var PTR = [];
      for (var pn = 0; pn < 9; pn++) {
        var pp = pts[(Math.random() * pts.length) | 0], pa = Math.random() * 6.2832, pv = (.05 + Math.random() * .1) * px;
        PTR.push({ x: o.left - sr.left + pp[0], y: o.top - sr.top + pp[1], vx: Math.cos(pa) * pv, vy: Math.sin(pa) * pv });
      }
      var SWAY = [0, 1, 2].map(function (j) {   // three waves across the word, so neighbours move alike
        var a = Math.random() * 6.2832, kw = 6.2832 / ([.6, .9, 1.35][j] * px);   // 40, 60, 90 px long
        return { a: [2, 1.3, .7][j] * px / 66.8 * .75, kx: Math.cos(a) * kw, ky: Math.sin(a) * kw, ph: Math.random() * 6.2832 };
      });
      // One piece: its offset from its spot (its circle, plus the current's at the corner, plus the pointers' push at
      // the centre) calms down from 4000 ms to RF (the
      // corner: the same 1700 ms up to F1); it sits where the word would, scaled as the word was, as bright as the
      // word was, and soft by how far it is from its spot (the half-resolution canvas, 8 px): all soft from 15 px off.
      // The circle: the three waves turning clockwise on screen (x right, y down), together up to 3 px (1 px on the

      // backwards it still turns clockwise
      function piece(p, n, T, tx, ty, vx, vy, at, fwd, fade, rt, flip) {

        var a = corner ? band(.4, 1, f) : band(.4, 1, c) * fade, g = corner ? 1 : forward(.7, c) * (fwd || 1);

        if (flip) dx = -dx;
        // the in's pointers; going out the entrance is played from RF, so there its time is stretched to start at M0
        var pt = flip ? rt * M0 / RF : rt;
        if (!corner && pt < M0) {
          var pu = 1 - band(2000 * K, M0, pt), ts = pt / K / 1000, RAD = 1.5 * px, PUSH = .18 * px;
          for (j = 0; j < PTR.length; j++) {
            var u = p.ax - PTR[j].x - PTR[j].vx * ts, v = p.ay - PTR[j].y - PTR[j].vy * ts, d = Math.sqrt(u * u + v * v);

          }
        }

        var soft = Math.min(1, Math.sqrt(dx * dx + dy * dy) / (.225 * px));
        var s = p.s * g, X = vx + (tx + dx - vx) * g - s / 2, Y = vy + (ty + dy - vy) * g - s / 2;
        if (a * (1 - soft) > .002) {
          xp.globalAlpha = a * (1 - soft);
          xp.drawImage(p.piece, X * dpr, Y * dpr, s * dpr, s * dpr);
        }
        if (a * soft > .002) {
          xq.globalAlpha = a * soft;
          xq.drawImage(p.piece, X * LO, Y * LO, s * LO, s * LO);
        }
      }
      // the puffs at half resolution; the pieces under them: the sharp ones at full resolution, the soft ones at half
      var cvS = canvas(Math.round(W * LO), Math.round(H * LO));
      var cvP = canvas(Math.round(W * dpr), Math.round(H * dpr)), cvQ = canvas(Math.round(W * LO), Math.round(H * LO));
      cvS.className = cvP.className = cvQ.className = 'intro-specks';
      shot.appendChild(cvQ);
      shot.appendChild(cvP);
      cvQ.style.filter = 'blur(' + (.12 * px).toFixed(1) + 'px)';   // 8 px at 1920 wide
      word.style.visibility = 'hidden';   // the word itself never shows, its pieces are the word
      word.style.filter = '';
      shot.appendChild(cvS);
      var xs = cvS.getContext('2d'), xp = cvP.getContext('2d'), xq = cvQ.getContext('2d'), KMAX = 6, last = 0, lastBlur = '', lastPBlur = '';
      // each piece's push by the mouse on the held word and its speed (px, px/s); stirred while any is pushed

      return {
        save: function () {   // every particle's position now, for draw's at

          return b;
        },
        // fade: brightness; blur: the soft blur in px; ghost: move only; at: positions from save to draw instead,
        // nothing moves; fwd: the whole cloud drawn that much nearer its centre and smaller (coming forward); rt: the
        // opening's ms of the picture (the circles); flip: each offset from its spot mirrored left to right (going out);

        draw: function (T, fade, blur, ghost, at, fwd, rt, flip, pblur) {

            place(E2, t);

              var r = ramp(T, p.m0, p.m1);

              a = (p.puff ? 1 : .3 + .7 * band(0, .15, r)) * (1 - r) * (1 - r);

              tau = ramp(T, p.f0, p.f1);
              tx = p.bx; ty = p.by; sw = 1 - .85 * tau; k = KMAX * tau * tau; d = forward(p.deep, tau); vx = MX + sx; vy = MY + sy;
              a = Math.min(1, tau * 4) * (p.puff ? 1 : 1 - .7 * band(.75, 1, tau));

            if (fwd) d *= fwd;

        },
        // The mouse on the held word, m = { x, y, vx, vy } in px of the shot and px/s (null: gone). Pieces within 1.5em
        // (100 px at 1920 wide) of it are pushed out from it, up to .18em at its centre (pushed pieces go soft), and
        // its movement carries them along, up to .3em for a fast swipe; a spring brings them back in about a second.
        // dt in s. True while anything is still on its way.
        stir: function (m, dt) {

        fade: function () { cvS.style.opacity = cvP.style.opacity = cvQ.style.opacity = '0'; },
        show: function () { cvS.style.opacity = cvP.style.opacity = cvQ.style.opacity = ''; },
        remove: function () { [cvS, cvP, cvQ].forEach(function (e) { if (e.parentNode) e.parentNode.removeChild(e); }); }

    }

    // Every particle's position at each 60th of a second of real time (K ms of the opening's), worked out as it plays;
    // going out shows the entrance's again

        var grow = forward(.7, c) * near(R) * go;

        word.style.opacity = (m > 0 ? 1 - inout(m) : band(.4, 1, c) * up).toFixed(3);
        word.style.transform = 'translate(-50%, -50%) scale(' + grow.toFixed(4) + ')';
      } else word.style.opacity = '0';
      if (f > 0) {
        if (!mark.style.filter) mark.style.filter = 'url(#smoke-b)';
        smoke(B, (1 - f) * (1 - f), sec + 7, blur);
        mark.style.setProperty('--intro', (fx ? +(T >= F1) : band(.4, 1, f)).toFixed(3));   // its pieces until F1
      } else { mark.style.removeProperty('--intro'); mark.style.filter = ''; }

      else if (fx) { fx.show(); ensure(i); fx.draw(T, (1 - ease(l)) * up, blur, false, frames[k], near(R) * go, R, flip, shown < F0 ? blur / 2 : blur); }
    }

      if (R < END) requestAnimationFrame(tick); else clearTimeout(window.introGuard);

    } catch (e) { if (fx) fx.remove(); fx = null; }

  })();
