<div style="background: #fff; padding: 100px 60px;">

</div>

<script>
  const topLayer = document.getElementById('top-layer');
  const bottomLayer = document.getElementById('bottom-layer');

  const maxTravel = (4220.58 - 1920) / 4;
  const center = -(4220.58 - 1920) / 2;

  // Animation spread over full 150vh for slower feel
  const animEnd = window.innerHeight * 1.5;

  function onScroll() {
    const progress = Math.min(window.scrollY / animEnd, 1);
    const offset = progress * maxTravel;
    topLayer.setAttribute('transform', `translate(${center - offset}, 0)`);
    bottomLayer.setAttribute('transform', `translate(${center + offset}, 0)`);
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
</script>
