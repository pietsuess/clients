<script>
  const bgLines = document.querySelector('.bg-lines');
  const heartLines = document.querySelector('.heart-lines');
  const bgRects = bgLines.querySelectorAll('rect');
  const heartPaths = heartLines.querySelectorAll('path, polygon');

  const maxShift = 600;

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function update() {
    const scrollY = window.scrollY;
    const maxScroll = document.body.scrollHeight - window.innerHeight;
    const rawProgress = Math.min(scrollY / maxScroll, 1);
    const progress = easeInOutCubic(rawProgress);

    const bgShift = progress * maxShift;
    const heartShift = progress * maxShift;

    bgLines.setAttribute('transform', `translate(${bgShift}, 0)`);
    heartLines.setAttribute('transform', `translate(${-heartShift}, 0)`);

    // Color transition: black -> original pink
    const colorProgress = Math.min(rawProgress * 2.5, 1);
    const r = Math.round(lerp(0, 0xef, colorProgress));
    const g = Math.round(lerp(0, 0x91, colorProgress));
    const b = Math.round(lerp(0, 0xfb, colorProgress));
    const color = `rgb(${r},${g},${b})`;

    bgRects.forEach(rect => rect.style.fill = color);
    heartPaths.forEach(el => el.style.fill = color);
  }

  window.addEventListener('scroll', update, { passive: true });
  update();
</script>
