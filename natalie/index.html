  <!-- Bottom layer: black lines, clipped to heart shape (clip is on fixed wrapper) -->
  <g clip-path="url(#heart-clip)">
    <g id="bottom-layer" fill="#000">
      <use href="#lines"/>
    </g>
  </g>

  <!-- Top layer: black lines, heart cut out (fixed mask) -->
  <g mask="url(#heart-cutout)">
    <g id="top-layer" fill="#000">
      <use href="#lines"/>
    </g>
  </g>

<script>
  const topLayer = document.getElementById('top-layer');
  const bottomLayer = document.getElementById('bottom-layer');

  // Lines: 4220.58 wide, viewport: 1920
  // Max travel each direction from center: (4220.58 - 1920) / 2 = 1150.29
  const maxTravel = (4220.58 - 1920) / 2;
  const center = -maxTravel; // starting offset to center the pattern

  let progress = 0;
  const speed = 0.0015;

  function render() {
    const offset = progress * maxTravel;
    topLayer.setAttribute('transform', `translate(${center - offset}, 0)`);
    bottomLayer.setAttribute('transform', `translate(${center + offset}, 0)`);
  }

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    progress = Math.max(0, Math.min(1, progress + e.deltaY * speed));
    render();
  }, { passive: false });

  render();
</script>
