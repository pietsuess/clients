<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squeen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }

  svg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>

<svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">

  <!-- Solid heart shape (always in place, revealed by slats) -->
  <path id="heart" fill="#ef91fb" d="
    M735.48,399.48
    C735.48,380 748,355 766.32,350.92
    C780,340 790,333 797.16,330.02

    C900,329 910,333 920.51,337.47
    C935,345 945,353 951.35,357.55
    C960,363 970,368 982.19,371.75
    C990,360 1000,352 1013.03,347.32
    C1025,338 1035,333 1043.86,330.76
    C1055,325 1065,322 1074.7,321.3
    C1085,319 1095,319 1105.54,318.82

    C878,652 868,641 858.84,634.16
    C848,621 838,610 828,603.32
    C817,590 807,578 797.16,572.48
    C785,558 775,545 766.32,538.42
    C755,525 745,510 735.48,479.51
    Z"/>

  <!-- Black slats (cover layer) -->
  <g id="slats"></g>

</svg>

<script>
  const svgNS = 'http://www.w3.org/2000/svg';
  const slatsGroup = document.getElementById('slats');

  const numCells = 100;
  const cellWidth = 1920 / numCells;
  const extra = 10;
  const totalSlats = numCells + extra * 2;
  const slats = [];

  for (let i = 0; i < totalSlats; i++) {
    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('y', '-50');
    rect.setAttribute('height', '1180');
    rect.setAttribute('fill', '#000');
    slatsGroup.appendChild(rect);
    slats.push(rect);
  }

  let progress = 0;
  const speed = 0.002;

  function render() {
    const slatWidth = cellWidth * (1 - progress * 0.62);

    for (let i = 0; i < totalSlats; i++) {
      const cellIndex = i - extra;
      const centerX = cellIndex * cellWidth + cellWidth / 2;
      const x = centerX - slatWidth / 2;
      slats[i].setAttribute('x', x.toFixed(2));
      slats[i].setAttribute('width', slatWidth.toFixed(2));
    }
  }

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    progress = Math.max(0, Math.min(1, progress + e.deltaY * speed));
    render();
  }, { passive: false });

  render();
</script>

</body>
</html>
