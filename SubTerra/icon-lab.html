<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subterra — Icon Animation Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --accent:#2f7abf; --ink:#e9e2d6; --dur:560ms; --stag:90ms; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#0b0907; color:var(--ink);
    font-family:"Titillium Web", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  header { padding:34px clamp(20px,5vw,72px) 10px; }
  h1 { margin:0 0 4px; font:800 clamp(1.5rem,2.6vw,2.2rem)/1 "Archivo", sans-serif; letter-spacing:-.01em; }
  .sub { color:rgba(233,226,214,.6); font-size:.95rem; }

  /* control bar */
  .controls { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center;
    padding:16px clamp(20px,5vw,72px); margin-top:14px;
    background:rgba(11,9,7,.86); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    border-top:1px solid rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.08); }
  .seg { display:inline-flex; gap:6px; background:rgba(255,255,255,.05); padding:5px; border-radius:999px; }
  .seg button { appearance:none; border:0; cursor:pointer; color:rgba(233,226,214,.74);
    background:none; padding:8px 16px; border-radius:999px; font:700 .76rem/1 "Titillium Web"; letter-spacing:.08em;
    text-transform:uppercase; transition:background .18s, color .18s; }
  .seg button.on { background:var(--accent); color:#fff; }
  .ctl { display:inline-flex; align-items:center; gap:9px; font-size:.78rem; letter-spacing:.06em;
    text-transform:uppercase; color:rgba(233,226,214,.6); }
  input[type=range] { accent-color:var(--accent); width:120px; }
  .btn { appearance:none; cursor:pointer; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06);
    color:#fff; border-radius:999px; padding:9px 20px; font:700 .78rem/1 "Titillium Web"; letter-spacing:.08em;
    text-transform:uppercase; transition:background .18s, border-color .18s; }
  .btn:hover { background:rgba(47,122,191,.22); border-color:var(--accent); }
  .btn.toggle.on { background:var(--accent); border-color:var(--accent); }

  /* grid */
  .grid { display:grid; gap:18px; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    padding:26px clamp(20px,5vw,72px) 80px; }
  .card { position:relative; display:flex; flex-direction:column; align-items:center; gap:16px;
    padding:34px 18px 22px; border-radius:18px; cursor:pointer;
    background:radial-gradient(120% 120% at 50% 30%, rgba(47,122,191,.10), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.08); transition:border-color .2s, transform .2s; }
  .card:hover { border-color:rgba(47,122,191,.5); transform:translateY(-2px); }
  .card svg { width:120px; height:120px; display:block; overflow:visible; }
  .card .label { font:700 .72rem/1.2 "Titillium Web"; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(233,226,214,.62); text-align:center; }
  .hint { padding:0 clamp(20px,5vw,72px); color:rgba(233,226,214,.45); font-size:.82rem; }

  /* facets start hidden; .play arms the chosen animation, staggered per facet */
  .card svg path { transform-box:fill-box; transform-origin:center; opacity:0; }
  .grid.play .card svg path { animation-duration:var(--dur); animation-fill-mode:forwards;
    animation-timing-function:cubic-bezier(.2,.9,.25,1.2); animation-delay:calc(var(--i) * var(--stag)); }

  .grid.s-assemble.play .card svg path { animation-name:a-assemble; }
  .grid.s-rise.play     .card svg path { animation-name:a-rise; }
  .grid.s-fan.play      .card svg path { animation-name:a-fan; }
  .grid.s-pop.play      .card svg path { animation-name:a-pop; }
  .grid.s-drop.play     .card svg path { animation-name:a-drop; }

  @keyframes a-assemble { from { opacity:0; transform:scale(.25); } to { opacity:1; transform:scale(1); } }
  @keyframes a-rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes a-fan  { from { opacity:0; transform:rotate(-22deg) scale(.55); } to { opacity:1; transform:rotate(0) scale(1); } }
  @keyframes a-pop  { 0% { opacity:0; transform:scale(.2); } 70% { opacity:1; transform:scale(1.12); } 100% { opacity:1; transform:scale(1); } }
  @keyframes a-drop { from { opacity:0; transform:translateY(-18px) scale(.9); } to { opacity:1; transform:translateY(0) scale(1); } }
</style>
</head>
<body>
  <header>
    <h1>Subterra &middot; Icon Animation Lab</h1>
    <div class="sub">Every section icon, building in. Pick a style, tune the timing, then we port the winner into the site. Click any icon to replay just that one.</div>
  </header>

  <div class="controls">
    <div class="seg" id="styles">
      <button data-style="assemble" class="on">Assemble</button>
      <button data-style="rise">Rise</button>
      <button data-style="fan">Fan</button>
      <button data-style="pop">Pop</button>
      <button data-style="drop">Drop</button>
    </div>
    <label class="ctl">Speed <input type="range" id="dur" min="220" max="1100" step="20" value="560"></label>
    <label class="ctl">Stagger <input type="range" id="stag" min="0" max="220" step="10" value="90"></label>
    <button class="btn" id="replay">Replay all</button>
    <button class="btn toggle on" id="loop">Loop</button>
  </div>

  <p class="hint" id="readout"></p>
  <div class="grid s-assemble" id="grid"></div>

<script>
  // the eight real section icons, pulled verbatim from the site
  const ICONS = [
    { label:'Strata (hero)', svg:'<svg viewBox="0 0 96 96"><path fill="#cadeef" d="M48 17 L74 30 L48 43 L22 30 Z"/><path fill="#7badd7" d="M22 30 L48 43 L48 51.7 L22 38.7 Z"/><path fill="#4f93cf" d="M22 38.7 L48 51.7 L48 60.3 L22 47.3 Z"/><path fill="#2f7abf" d="M22 47.3 L48 60.3 L48 69 L22 56 Z"/><path fill="#1f66ab" d="M74 30 L48 43 L48 51.7 L74 38.7 Z"/><path fill="#0a64bf" d="M74 38.7 L48 51.7 L48 60.3 L74 47.3 Z"/><path fill="#0a4a82" d="M74 47.3 L48 60.3 L48 69 L74 56 Z"/></svg>' },
    { label:'What we do', svg:'<svg viewBox="0 0 96 96"><path fill="#cadeef" d="M48 20 L76 34 L48 48 L20 34 Z"/><path fill="#2f7abf" d="M20 34 L48 48 L48 56 L20 42 Z"/><path fill="#0a4a82" d="M76 34 L48 48 L48 56 L76 42 Z"/><path fill="none" stroke="#1f66ab" stroke-width="1.4" d="M29.3 29.3 L57.3 43.3 M38.7 24.7 L66.7 38.7 M57.3 24.7 L29.3 38.7 M66.7 29.3 L38.7 43.3"/></svg>' },
    { label:'Excavation', svg:'<svg viewBox="0 0 96 96"><path fill="#9dc4e4" d="M38 18.5 L53 26 L38 33.5 L23 26 Z"/><path fill="#2f7abf" d="M23 26 L38 33.5 L38 48.5 L23 41 Z"/><path fill="#0a4a82" d="M53 26 L38 33.5 L38 48.5 L53 41 Z"/><path fill="#9dc4e4" d="M50 26.5 L65 34 L50 41.5 L35 34 Z"/><path fill="#2f7abf" d="M35 34 L50 41.5 L50 56.5 L35 49 Z"/><path fill="#0a4a82" d="M65 34 L50 41.5 L50 56.5 L65 49 Z"/><path fill="#9dc4e4" d="M62 34.5 L77 42 L62 49.5 L47 42 Z"/><path fill="#2f7abf" d="M47 42 L62 49.5 L62 64.5 L47 57 Z"/><path fill="#0a4a82" d="M77 42 L62 49.5 L62 64.5 L77 57 Z"/></svg>' },
    { label:'Land Clearing', svg:'<svg viewBox="0 0 96 96"><path fill="#2f7abf" d="M48 61.5 L53 64 L48 66.5 L43 64 Z"/><path fill="#1f66ab" d="M43 64 L48 66.5 L48 74.5 L43 72 Z"/><path fill="#08365f" d="M53 64 L48 66.5 L48 74.5 L53 72 Z"/><path fill="#7badd7" d="M48 40 L30 58 L48 66 Z"/><path fill="#0a64bf" d="M48 40 L66 58 L48 66 Z"/><path fill="#cadeef" d="M48 26 L34 42 L48 49 Z"/><path fill="#2f7abf" d="M48 26 L62 42 L48 49 Z"/></svg>' },
    { label:'Trenching', svg:'<svg viewBox="0 0 96 96"><path fill="#9dc4e4" d="M47.2 16 L61.82 21.51 L61.82 29.31 L78 35.23 L48 53.39 L31.45 45.6 L31.45 37.35 L18 30.6 Z"/><path fill="#2f7abf" d="M18 30.6 L31.45 37.35 L31.45 45.6 L48 53.39 L48 67.6 L18 52.6 Z"/><path fill="#0a4a82" d="M78 35.23 L48 53.39 L48 67.6 L78 47.8 Z"/><path fill="#0e3252" d="M61.82 21.51 L31.45 37.35 L31.45 45.6 L61.82 29.31 Z"/></svg>' },
    { label:'On the ground', svg:'<svg viewBox="0 0 96 96"><path fill="#9dc4e4" d="M50 35 L72 46 L50 57 L28 46 Z"/><path fill="#2f7abf" d="M28 46 L50 57 L50 63 L28 52 Z"/><path fill="#0a4a82" d="M72 46 L50 57 L50 63 L72 52 Z"/><path fill="#2f7abf" d="M48.5 16.5 L50 17 L50 49 L48.5 48.5 Z"/><path fill="#0a4a82" d="M50 17 L51.5 16.5 L51.5 48.5 L50 49 Z"/><path fill="#7badd7" d="M50 15 L66 20 L50 25 Z"/></svg>' },
    { label:'Why Subterra', svg:'<svg viewBox="0 0 96 96"><path fill="#cadeef" d="M48 16 L30 38 L48 46 Z"/><path fill="#7badd7" d="M48 16 L66 38 L48 46 Z"/><path fill="#2f7abf" d="M48 64 L30 38 L48 46 Z"/><path fill="#0a64bf" d="M48 64 L66 38 L48 46 Z"/></svg>' },
    { label:'Contact', svg:'<svg viewBox="0 0 96 96"><path fill="#cadeef" d="M22 33 L48 20 L74 33 L48 33.5 Z"/><path fill="#9dc4e4" d="M22 33 L74 33 L48 46 Z"/><path fill="#2f7abf" d="M22 33 L48 46 L48 54 L22 41 Z"/><path fill="#0a4a82" d="M74 33 L48 46 L48 54 L74 41 Z"/></svg>' },
  ];

  const grid = document.getElementById('grid');
  const readout = document.getElementById('readout');
  let style = 'assemble', loop = true, loopTimer = null;

  // build cards
  ICONS.forEach(function (ic) {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = ic.svg + '<div class="label">' + ic.label + '</div>';
    // index each facet for the staggered delay
    Array.prototype.slice.call(card.querySelectorAll('path')).forEach(function (p, i) { p.style.setProperty('--i', i); });
    card.addEventListener('click', function () { replayOne(card); });
    grid.appendChild(card);
  });

  function maxPaths () { return Math.max.apply(null, ICONS.map(function (i) { return (i.svg.match(/<path/g) || []).length; })); }
  function cycleMs () { const dur = +document.getElementById('dur').value, stag = +document.getElementById('stag').value;
    return dur + stag * maxPaths() + 420; }

  function restart (el) { el.classList.remove('play'); void el.offsetWidth; el.classList.add('play'); }
  function replayAll () { restart(grid); }
  function replayOne (card) {
    // replay a single card: briefly run only it
    card.querySelectorAll('path').forEach(function (p) { p.style.animation = 'none'; });
    void card.offsetWidth;
    card.querySelectorAll('path').forEach(function (p) { p.style.animation = ''; });
    grid.classList.add('play');
  }
  function setStyle (s) {
    style = s;
    grid.className = 'grid s-' + s + (grid.classList.contains('play') ? ' play' : '');
    document.querySelectorAll('#styles button').forEach(function (b) { b.classList.toggle('on', b.dataset.style === s); });
    replayAll();
  }
  function syncReadout () {
    readout.textContent = 'Style: ' + style + '  ·  ' + document.getElementById('dur').value + 'ms build  ·  '
      + document.getElementById('stag').value + 'ms per-facet stagger  ·  ' + (loop ? 'looping' : 'manual');
  }
  function armLoop () { if (loopTimer) clearInterval(loopTimer); if (loop) loopTimer = setInterval(replayAll, cycleMs()); }

  document.getElementById('styles').addEventListener('click', function (e) {
    const b = e.target.closest('button'); if (!b) return; setStyle(b.dataset.style); syncReadout(); armLoop();
  });
  document.getElementById('dur').addEventListener('input', function () {
    document.documentElement.style.setProperty('--dur', this.value + 'ms'); syncReadout(); armLoop(); });
  document.getElementById('stag').addEventListener('input', function () {
    document.documentElement.style.setProperty('--stag', this.value + 'ms'); syncReadout(); armLoop(); });
  document.getElementById('replay').addEventListener('click', function () { replayAll(); armLoop(); });
  document.getElementById('loop').addEventListener('click', function () {
    loop = !loop; this.classList.toggle('on', loop); syncReadout(); armLoop(); });

  setStyle('assemble'); syncReadout(); armLoop();
</script>
</body>
</html>
