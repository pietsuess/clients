<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charlotte Priest</title>
<style>
  :root { --bg: #fff; --gap: 6px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); }
  .head { padding: var(--gap) var(--gap) 0; width: 100%; }
  .head h1 { color: #B5E3DC; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; white-space: nowrap; line-height: 1; text-transform: uppercase; text-align: center; font-size: 100px; letter-spacing: -.01em; }
  .head h1 span { display: inline-block; }
  .head hr { border: 0; border-top: 2px solid #B5E3DC; margin-top: var(--gap); }
  .filters { display: flex; justify-content: center; gap: var(--gap); margin-top: var(--gap); }
  .filters button { font: 700 14px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; text-transform: uppercase; color: #00BFDF; background: none; border: 0; padding: 6px 12px; cursor: pointer; }
  .filters button.active { background: #00BFDF; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--gap); padding: var(--gap); width: 100%; }
  .grid .thumb { display: block; width: 100%; aspect-ratio: 1 / 1; border: 0; padding: 0; background: #eee; cursor: zoom-in; overflow: hidden; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .2s; }
  .grid .thumb:hover img { opacity: .85; }
  @media (max-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  .lb { position: fixed; inset: 0; background: #000; display: none; align-items: center; justify-content: center; z-index: 10; }
  .lb.open { display: flex; }
  .lb img { max-width: 100vw; max-height: 100vh; width: auto; height: auto; object-fit: contain; display: block; user-select: none; }
  .lb button { position: absolute; background: none; border: 0; color: #fff; cursor: pointer; opacity: .7; transition: opacity .2s; }
  .lb button:hover { opacity: 1; }
  .lb button svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.5; filter: drop-shadow(0 0 3px rgba(0,0,0,.6)); }
  .lb .prev, .lb .next { top: 50%; transform: translateY(-50%); width: 56px; height: 56px; padding: 8px; }
  .lb .prev { left: 16px; }
  .lb .next { right: 16px; }
  .lb .close { top: 16px; right: 16px; width: 44px; height: 44px; padding: 8px; }
  .cell { position: relative; }
  .heart { position: absolute; right: 6px; bottom: 6px; width: 34px; height: 34px; padding: 6px; border: 0; background: none; cursor: pointer; color: #fff; }
  .heart svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; filter: drop-shadow(0 0 2px rgba(0,0,0,.6)); transition: transform .15s; }
  .heart:hover svg { transform: scale(1.12); }
  .heart.on { color: #E0245E; }
  .heart.on svg { fill: currentColor; }
  .heart.star { color: #F5B301; }
  .heart.star svg { fill: currentColor; }
  .lb .heart { right: 12px; bottom: 8px; width: 44px; height: 44px; opacity: 1; }
  .lb .name { position: absolute; left: 12px; bottom: 10px; color: #fff; opacity: .6; font: 11px/1 -apple-system, Helvetica, Arial, sans-serif; letter-spacing: .02em; text-shadow: 0 0 3px rgba(0,0,0,.8); pointer-events: none; }
</style>
</head>
<body>
<header class="head"><h1><span id="title">Charlotte Priest</span></h1><hr>
<nav class="filters" id="filters"><button data-f="all" class="active">Show all</button><button data-f="star">Show star</button><button data-f="heart">Show heart</button><button data-f="selects">Show selects</button></nav><hr></header>
<div class="grid" id="grid"></div>

<div class="lb" id="lb">
  <img id="lbImg" alt="">
  <div class="name" id="lbName"></div>
  <button class="heart" id="lbHeart" aria-label="Favorite"></button>
  <button class="prev" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
  <button class="next" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
  <button class="close" id="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
</div>

<script>
const title = document.getElementById("title");
function fitTitle() {
  const h1 = title.parentElement;
  h1.style.fontSize = "100px";
  h1.style.fontSize = (100 * h1.clientWidth / title.getBoundingClientRect().width) + "px";
}
fitTitle();
window.addEventListener("resize", fitTitle);
document.fonts && document.fonts.ready.then(fitTitle);

const DIR = "Selects/";
const V = "?v=2";
// Per-photo fingerprints from versions.json, which goes live in the same site update as the photos,
// so a new fingerprint never points at an old photo.
const vers = {};
const src = name => DIR + encodeURIComponent(name) + (vers[name] ? "?v=" + vers[name] : V);
const photos = ["CharlottePriest_DSC03580-web.jpg", "CharlottePriest_DSC03600-web.jpg", "CharlottePriest_DSC03602-web.jpg", "CharlottePriest_DSC03620-web.jpg", "CharlottePriest_DSC03627-web.jpg", "CharlottePriest_DSC03641-web.jpg", "CharlottePriest_DSC03656-web.jpg", "CharlottePriest_DSC03670-web.jpg", "CharlottePriest_DSC03710-web.jpg", "CharlottePriest_DSC03720-web.jpg", "CharlottePriest_DSC03729-web.jpg", "CharlottePriest_DSC03732-web.jpg", "CharlottePriest_DSC03738-web.jpg", "CharlottePriest_DSC03771-web.jpg", "CharlottePriest_DSC03815-web.jpg", "CharlottePriest_DSC03827-web.jpg", "CharlottePriest_DSC03842-web.jpg", "CharlottePriest_DSC03872-2-web.jpg", "CharlottePriest_DSC03877-web.jpg", "CharlottePriest_DSC03893-web.jpg", "CharlottePriest_DSC03919-2-web.jpg", "CharlottePriest_DSC03934-2-web.jpg", "CharlottePriest_DSC03937-2-web.jpg", "CharlottePriest_DSC03953-web.jpg", "CharlottePriest_DSC03964-web.jpg", "CharlottePriest_DSC03973-web.jpg", "CharlottePriest_DSC03995-web.jpg", "CharlottePriest_DSC04041-web.jpg", "CharlottePriest_DSC04049-web.jpg", "CharlottePriest_DSC04050-web.jpg", "CharlottePriest_DSC04060-web.jpg", "CharlottePriest_DSC04103-web.jpg", "CharlottePriest_DSC04114-web.jpg", "CharlottePriest_DSC04145-web.jpg", "CharlottePriest_DSC04179-web.jpg", "CharlottePriest_DSC04194-web.jpg", "CharlottePriest_DSC04214-web.jpg", "CharlottePriest_DSC04282-web.jpg", "CharlottePriest_DSC04327-web.jpg", "CharlottePriest_DSC04340-web.jpg", "CharlottePriest_DSC04423-web.jpg", "CharlottePriest_DSC04431-web.jpg", "CharlottePriest_DSC04434-web.jpg", "CharlottePriest_DSC04452-web.jpg", "CharlottePriest_DSC04463-web.jpg", "CharlottePriest_DSC04483-web.jpg", "CharlottePriest_DSC04496-2-web.jpg", "CharlottePriest_DSC04501-web.jpg", "CharlottePriest_DSC04505-web.jpg", "CharlottePriest_DSC04520-web.jpg", "CharlottePriest_DSC04526-web.jpg", "CharlottePriest_DSC04533-2-web.jpg", "CharlottePriest_DSC04539-web.jpg", "CharlottePriest_DSC04543-2-web.jpg", "CharlottePriest_DSC04545-web.jpg", "CharlottePriest_DSC04557-web.jpg", "CharlottePriest_DSC04558-web.jpg", "CharlottePriest_DSC04592-web.jpg", "CharlottePriest_DSC04603-web.jpg", "CharlottePriest_DSC04617-web.jpg", "CharlottePriest_DSC04633-web.jpg", "CharlottePriest_DSC04651-web.jpg", "CharlottePriest_DSC04662-web.jpg", "CharlottePriest_DSC04667-web.jpg", "CharlottePriest_DSC04672-web.jpg", "CharlottePriest_DSC04681-web.jpg", "CharlottePriest_DSC04691-web.jpg", "CharlottePriest_DSC04706-web.jpg", "CharlottePriest_DSC04716-web.jpg", "CharlottePriest_DSC04724-web.jpg", "CharlottePriest_DSC04728-web.jpg"];
const grid = document.getElementById("grid");
const lb = document.getElementById("lb");
const lbImg = document.getElementById("lbImg");
let i = 0;

function build() { photos.forEach((name, n) => {
  const b = document.createElement("button");
  b.className = "thumb";
  const img = document.createElement("img");
  img.src = src(name);
  img.loading = "lazy";
  img.decoding = "async";
  img.alt = "";
  b.appendChild(img);
  b.addEventListener("click", () => openAt(n));
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.file = name;
  cell.append(b, heartButton(name));
  grid.appendChild(cell);
}); paintHearts(); }

// Shared hearts: everyone sees the same favorites (Cloudflare worker at /hearts-api).
const HEARTS = "/hearts-api";
const GALLERY = "CharlottePriest";
const HEART_SVG = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 6.9 4.5c2.1 0 3.9 1.1 5.1 2.9 1.2-1.8 3-2.9 5.1-2.9 3.5 0 5.5 3.5 4.2 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>';
const STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z"/></svg>';
const NEXT = { undefined: "heart", heart: "star", star: null }; // click cycle: off -> heart -> star -> off
const marks = new Map(); // file -> "heart" | "star"
const lbHeart = document.getElementById("lbHeart");
lbHeart.innerHTML = HEART_SVG;

function heartButton(name) {
  const h = document.createElement("button");
  h.className = "heart";
  h.setAttribute("aria-label", "Favorite");
  h.dataset.file = name;
  h.innerHTML = HEART_SVG;
  return h;
}
function paintHearts() {
  document.querySelectorAll(".heart").forEach(h => {
    const kind = marks.get(h.dataset.file);
    h.classList.toggle("on", kind === "heart");
    h.classList.toggle("star", kind === "star");
    h.innerHTML = kind === "star" ? STAR_SVG : HEART_SVG;
    h.setAttribute("aria-pressed", !!kind);
  });
}
function toggleHeart(file) {
  const prev = marks.get(file), kind = NEXT[prev];
  const set = k => { k ? marks.set(file, k) : marks.delete(file); paintHearts(); };
  set(kind);
  fetch(HEARTS + "/heart?g=" + GALLERY, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ file, kind }) })
    .then(r => { if (!r.ok) throw 0; })
    .catch(() => set(prev));
}
document.addEventListener("click", e => {
  const h = e.target.closest(".heart");
  if (!h) return;
  e.stopPropagation();
  toggleHeart(h.dataset.file);
}, true);
fetch(HEARTS + "/marks?g=" + GALLERY, { cache: "no-store" })
  .then(r => r.ok ? r.json() : [])
  .then(list => { list.forEach(m => marks.set(m.file, m.kind)); paintHearts(); applyFilter(); })
  .catch(() => {});

let built = false;
const buildOnce = () => { if (!built) { built = true; build(); } };
setTimeout(buildOnce, 2500);
fetch("versions.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.ok ? r.json() : {})
  .then(v => Object.assign(vers, v))
  .catch(() => {})
  .finally(buildOnce);

// Filter row: star / heart / selects (star or heart) / all. Applied on button press, not on every heart click.
let filter = "all";
const visible = name => { const k = marks.get(name); return filter === "all" || (filter === "selects" ? !!k : k === filter); };
function applyFilter() { document.querySelectorAll(".grid .cell").forEach(c => { c.style.display = visible(c.dataset.file) ? "" : "none"; }); }
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("active", x === b));
  applyFilter();
});

function show() {
  lbImg.src = src(photos[i]);
  document.getElementById("lbName").textContent = photos[i];
  lbHeart.dataset.file = photos[i];
  paintHearts();
  [i - 1, i + 1].forEach(k => { const p = new Image(); p.src = src(photos[(k + photos.length) % photos.length]); });
}
function openAt(n) { i = n; show(); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
function close() { lb.classList.remove("open"); document.body.style.overflow = ""; }
function step(d) {
  const shown = [...document.querySelectorAll(".grid .cell")].filter(c => c.style.display !== "none").map(c => photos.indexOf(c.dataset.file));
  const at = shown.indexOf(i);
  if (at < 0) return;
  i = shown[(at + d + shown.length) % shown.length]; show();
}

document.getElementById("prev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
document.getElementById("next").addEventListener("click", e => { e.stopPropagation(); step(1); });
document.getElementById("close").addEventListener("click", close);
lb.addEventListener("click", e => { if (e.target === lb) close(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "Escape") close();
});
let x0 = null;
lb.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
  x0 = null;
});
</script>
</body>
</html>
