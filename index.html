<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piet Suess — Client Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  --gold: #f4c542;
  --coral: #e8735a;
  --cream: #fef9f0;
  --ink: #1a0e2e;
}
html { font-size: 16px; }
body {
  margin: 0; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  font-family: 'Poppins', sans-serif;
  color: var(--cream);
  background: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.bg-gradient {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg,
    #1a0e2e 0%, #2d1640 20%, #4a1942 35%, #7a2848 50%,
    #b8475a 65%, #d4766a 78%, #e8a555 90%, #f4c542 100%
  );
  background-size: 400% 400%;
  animation: gradientShift 20s ease infinite;
  z-index: 0;
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.bg-gradient::after {
  content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
}
.content { position: relative; z-index: 1; text-align: center; }
p {
  font-family: 'Urbanist', sans-serif;
  font-size: 1.6rem; font-weight: 300;
  letter-spacing: 0.12em; opacity: 0.8; margin: 0;
}
canvas { display: block; width: 200px; height: 120px; margin-top: 24px; }
</style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="content">
  <p>Coming soon.</p>
  <canvas id="squares"></canvas>
</div>
<script>
(function() {
  const c = document.getElementById('squares');
  const bigS = 48, smS = 36;

  function walkSquare(ctx, lineX, lineY, lineLen, size, dist, side) {
    const totalLen = lineLen;
    const rawDist = ((dist % totalLen) + totalLen) % totalLen;
    const steps = rawDist / size;
    const stepIdx = Math.floor(steps);
    const frac = steps - stepIdx;
    const eased = frac < 0.5
      ? 0.5 * Math.pow(frac * 2, 0.7)
      : 1 - 0.5 * Math.pow((1 - frac) * 2, 0.7);
    const tipAngle = eased * (Math.PI / 2);
    const pivotX = lineX + ((stepIdx + 1) * size) % totalLen;
    ctx.save();
    ctx.translate(pivotX, lineY);
    ctx.rotate(tipAngle);
    const s = size, r = s * 0.15;
    const yOff = side === 'above' ? -s : 0;
    const x = -s, y = yOff;
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+s-r,y);
    ctx.quadraticCurveTo(x+s,y,x+s,y+r); ctx.lineTo(x+s,y+s-r);
    ctx.quadraticCurveTo(x+s,y+s,x+s-r,y+s); ctx.lineTo(x+r,y+s);
    ctx.quadraticCurveTo(x,y+s,x,y+s-r); ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function walkTreadmill(ctx, centerX, groundY, size, dist, color) {
    const totalLen = size * 10000;
    const rawDist = ((dist % totalLen) + totalLen) % totalLen;
    const steps = rawDist / size;
    const stepIdx = Math.floor(steps);
    const frac = steps - stepIdx;
    const eased = frac < 0.5
      ? 0.5 * Math.pow(frac * 2, 0.7)
      : 1 - 0.5 * Math.pow((1 - frac) * 2, 0.7);
    const tipAngle = eased * (Math.PI / 2);
    const pivotVirtual = (stepIdx + 1) * size;
    const centerOffsetX = (size / 2) * (Math.sin(tipAngle) - Math.cos(tipAngle));
    const tx = centerX - pivotVirtual - centerOffsetX;
    ctx.save();
    ctx.translate(tx, 0);
    ctx.fillStyle = color;
    walkSquare(ctx, 0, groundY, totalLen, size, dist, 'above');
    ctx.restore();
  }

  let startTime = null;
  function render(time) {
    if (!startTime) startTime = time;
    const elapsed = (time - startTime) * 0.001;
    const rect = c.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = rect.width, h = rect.height;
    if (c.width !== Math.round(w*dpr) || c.height !== Math.round(h*dpr)) {
      c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
    }
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    const groundY = h * 0.75;
    const centerX = w * 0.5;
    const color = 'rgba(254,249,240,0.5)';
    walkTreadmill(ctx, centerX - bigS * 0.6, groundY, bigS, elapsed * 60, color);
    ctx.save();
    ctx.translate(centerX + smS * 0.6, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(centerX + smS * 0.6), 0);
    walkTreadmill(ctx, centerX + smS * 0.6, groundY, smS, elapsed * 45 + 200, color);
    ctx.restore();
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
