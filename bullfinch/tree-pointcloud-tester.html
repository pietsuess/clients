<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bullfinch Earth - Point Cloud Tester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..600&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --bg-elev:#0E0E0E; --ink:#FAFAFA; --ink-soft:#8E8E8E; --ink-quiet:#5A5A5A;
  --rule:rgba(250,250,250,0.08); --accent:#FF5560; --mote:#C8C2B5; --shaft:#E6D5B0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Inter',system-ui,sans-serif}

.scroll-space{height:500vh}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:14px;
  padding:14px 24px;background:rgba(5,5,5,0.82);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);
}
.nav svg{width:34px;height:24px;display:block}
.nav__mark-dark{fill:var(--ink)}
.nav__mark-red{fill:var(--accent)}
.nav__brand{font-family:'Geist',sans-serif;font-weight:600;font-size:14px;letter-spacing:.02em}
.nav__tag{
  margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-quiet);text-align:right;
}

.hud{
  position:fixed;left:24px;bottom:24px;z-index:100;
  font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;
  color:var(--ink-soft);line-height:1.8;pointer-events:none;
}
.hud span{color:var(--ink)}

.legend{
  position:fixed;right:24px;bottom:24px;z-index:100;
  font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-quiet);text-align:right;pointer-events:none;
}
</style>
</head>
<body>

<header class="nav">
  <svg viewBox="50 35 100 70" aria-hidden="true">
    <path class="nav__mark-dark" d="M87.29,97.03c-10.83.15-20.43.03-31.53-.39l51.92-50.87c5.68-5.57,11.86-9.26,20.32-7.38,5.99,1.33,11.92,5.07,15.3,10.28-5.45.71-9.56,2.12-13.1,5.57l-42.92,42.8Z"/>
    <path class="nav__mark-red" d="M100.48,96.87c3.96-4.58,7.06-7.58,10.96-11.43l7.06-6.91,6.66-6.52,8.01-7.92c2.12-2.09,5.01-3.96,7.88-2.85,5.18,2,8.29,13.78,3.49,23.16-3.47,6.79-9.75,11.7-17.44,12.85l-26.62-.39Z"/>
  </svg>
  <div class="nav__brand">Bullfinch Earth</div>
  <div class="nav__tag">Point Cloud Tester - Tree1<br>Scroll to take form · Drag to orbit</div>
</header>

<div class="hud">
  POINTS <span id="point-count">-</span><br>
  FORM <span id="form-pct">0%</span>
</div>

<div class="legend">Canopy 1/3 · Trunk 2/3</div>

<div class="scroll-space"></div>
<canvas id="stage"></canvas>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
  var BG = new THREE.Color(0x050505);
  var ACCENT = new THREE.Color(0xFF5560);
  var MOTE = new THREE.Color(0xC8C2B5);

  var canvas = document.getElementById('stage');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(BG, 1);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

  // hand-rolled orbit: no OrbitControls dependency
  var target = new THREE.Vector3(0, 3, 0);
  var theta = 0.6, phi = 1.25, dist = 14;
  var autoSpin = true;

  function applyCamera() {
    var sinPhi = Math.sin(phi);
    camera.position.set(
      target.x + dist * sinPhi * Math.sin(theta),
      target.y + dist * Math.cos(phi),
      target.z + dist * sinPhi * Math.cos(theta)
    );
    camera.lookAt(target);
  }

  var dragging = false, lastX = 0, lastY = 0;
  window.addEventListener('mousedown', function (e) {
    if (e.target !== document.body && e.target !== canvas) return;
    dragging = true; autoSpin = false; lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', function () { dragging = false; });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    theta -= (e.clientX - lastX) * 0.005;
    phi = Math.min(Math.PI - 0.05, Math.max(0.05, phi - (e.clientY - lastY) * 0.005));
    lastX = e.clientX; lastY = e.clientY;
  });

  var uniforms = {
    uProgress: { value: 0 },
    uSize: { value: 0.08 },
    uScale: { value: 1 },
    uOpacity: { value: 0.9 }
  };

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    uniforms.uScale.value = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  }
  window.addEventListener('resize', resize);
  resize();

  // scroll drives formation; smoothed each frame for a soft feel
  var scrollTargetP = 0, scrollP = 0;
  function readScroll() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    scrollTargetP = max > 0 ? window.scrollY / max : 0;
  }
  window.addEventListener('scroll', readScroll, { passive: true });
  readScroll();

  fetch('assets/tree-pointcloud.obj')
    .then(function (res) { return res.text(); })
    .then(function (text) {
      var positions = [];
      var minY = Infinity, maxY = -Infinity;
      var lines = text.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.charCodeAt(0) === 118 && line.charCodeAt(1) === 32) { // "v "
          var parts = line.split(' ');
          var x = parseFloat(parts[1]);
          var y = parseFloat(parts[2]);
          var z = parseFloat(parts[3]);
          positions.push(x, y, z);
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }

      var count = positions.length / 3;
      document.getElementById('point-count').textContent = count.toLocaleString();

      var posArr = new Float32Array(positions);
      var geoTmp = new THREE.BufferGeometry();
      geoTmp.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      geoTmp.computeBoundingSphere();
      var center = geoTmp.boundingSphere.center;
      var radius = geoTmp.boundingSphere.radius;

      // dispersed start: random shell around the model, 1.5x to 3x the radius out
      var startArr = new Float32Array(count * 3);
      var seedArr = new Float32Array(count);
      for (var s = 0; s < count; s++) {
        var u = Math.random() * 2 - 1;
        var ang = Math.random() * Math.PI * 2;
        var rr = radius * (1.5 + Math.random() * 1.5);
        var sq = Math.sqrt(1 - u * u);
        startArr[s * 3]     = center.x + rr * sq * Math.cos(ang);
        startArr[s * 3 + 1] = center.y + rr * u;
        startArr[s * 3 + 2] = center.z + rr * sq * Math.sin(ang);
        seedArr[s] = Math.random();
      }

      var colorArr = new Float32Array(count * 3);
      var tmp = new THREE.Color();
      for (var p = 0; p < count; p++) {
        var y = posArr[p * 3 + 1];
        var t = (y - minY) / (maxY - minY || 1);
        tmp.copy(MOTE).lerp(ACCENT, Math.pow(t, 2.2) * 0.35);
        colorArr[p * 3] = tmp.r;
        colorArr[p * 3 + 1] = tmp.g;
        colorArr[p * 3 + 2] = tmp.b;
      }

      var geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      geo.setAttribute('aStart', new THREE.BufferAttribute(startArr, 3));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seedArr, 1));
      geo.setAttribute('color', new THREE.BufferAttribute(colorArr, 3));
      geo.boundingSphere = geoTmp.boundingSphere;

      uniforms.uSize.value = Math.max(radius * 0.014, 0.01);

      var mat = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: [
          'attribute vec3 aStart;',
          'attribute float aSeed;',
          'uniform float uProgress;',
          'uniform float uSize;',
          'uniform float uScale;',
          'varying vec3 vColor;',
          'void main() {',
          '  float p = clamp(uProgress * 1.25 - aSeed * 0.25, 0.0, 1.0);',
          '  p = p * p * (3.0 - 2.0 * p);', // smoothstep ease per point
          '  vec3 pos = mix(aStart, position, p);',
          '  vec4 mv = modelViewMatrix * vec4(pos, 1.0);',
          '  gl_PointSize = uSize * uScale / -mv.z;',
          '  gl_Position = projectionMatrix * mv;',
          '  vColor = color;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'uniform float uOpacity;',
          'varying vec3 vColor;',
          'void main() {',
          '  vec2 c = gl_PointCoord - 0.5;',
          '  float d = length(c);',
          '  if (d > 0.5) discard;',
          '  float a = smoothstep(0.5, 0.3, d) * uOpacity;', // soft-edged circle
          '  gl_FragColor = vec4(vColor, a);',
          '}'
        ].join('\n'),
        vertexColors: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      scene.add(new THREE.Points(geo, mat));

      target.copy(center);
      dist = radius * 2.1;
    })
    .catch(function (err) {
      document.getElementById('point-count').textContent = 'ERR';
      console.error(err);
    });

  var pctEl = document.getElementById('form-pct');
  function tick() {
    scrollP += (scrollTargetP - scrollP) * 0.08;
    uniforms.uProgress.value = scrollP;
    pctEl.textContent = Math.round(scrollP * 100) + '%';
    if (autoSpin) theta += 0.0018;
    applyCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
