<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="logo-lotus-teal.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retreat Apparel | 52nd Annual Community Yoga Retreat</title>
<meta name="description" content="Commemorative apparel for the 52nd Annual Community Yoga Retreat at the Salt Spring Centre of Yoga.">
<meta property="og:title" content="Retreat Apparel | 52nd Annual Community Yoga Retreat">
<meta property="og:description" content="Commemorative apparel for the 52nd Annual Community Yoga Retreat at the Salt Spring Centre of Yoga.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Archivo+Narrow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --teal: #3bb8a8; --teal-dark: #2a8a7d; --teal-deep: #1a5c53;
  --cream: #faf8f4; --cream-warm: #f3ede3; --gold: #c9a84c;
  --terracotta: #c17838; --white: #fff; --charcoal: #2c2c2c;
  --text: #3a3a3a; --text-light: #7a7a7a;
}
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .reveal { opacity: 1 !important; transform: none !important; } }
body { font-family: 'Archivo Narrow', sans-serif; background: var(--cream); color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden; font-size: 24px; }
h1, h2 { font-family: 'Cinzel', serif; font-weight: 600; line-height: 1.2; color: var(--charcoal); text-wrap: balance; }
a { color: var(--teal-dark); text-decoration: none; }
img { max-width: 100%; display: block; }

/* PAGE HEADER */
.page-head { text-align: center; padding: 64px 32px 0; }
.page-head .lotus { width: 64px; height: auto; margin: 0 auto 20px; opacity: 0.9; }
.page-head .eyebrow { font-family: 'Cinzel', serif; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }

/* SHIRTS SECTION */
.shirts-section { padding: 48px 32px 110px; background: var(--white); margin-top: 48px; }
.shirts-section h2 { text-align: center; font-size: 2.4rem; color: var(--teal-deep); margin-bottom: 12px; }
.shirts-section .section-sub { text-align: center; font-size: 1rem; color: var(--text-light); max-width: 480px; margin: 0 auto 48px; line-height: 1.7; }
.shirts-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; max-width: 1200px; margin: 0 auto; }
.shirts-grid > .shirt-card:nth-child(1) { grid-column: 4 / span 2; grid-row: 1; }
.shirts-grid > .shirt-card:nth-child(2) { grid-column: 8 / span 2; grid-row: 1; }
.shirts-grid > .shirt-card:nth-child(n+3) { grid-column: span 3; grid-row: 2; }
.shirt-card { border-radius: 16px; overflow: hidden; background: var(--cream); transition: transform 0.3s ease, box-shadow 0.3s ease; }
.shirt-card:hover { transform: translateY(-4px); box-shadow: 0 12px 36px rgba(0,0,0,0.08); }
.shirt-card img { width: 100%; aspect-ratio: 4/5; object-fit: cover; }
.shirt-card .shirt-label { padding: 16px 20px; font-family: 'Cinzel', serif; font-size: 0.82rem; font-weight: 600; color: var(--charcoal); text-align: center; letter-spacing: 0.03em; }

/* REVEAL */
.reveal { opacity: 0; transform: translateY(40px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
.reveal.in-view { opacity: 1; transform: none; }
.d1 { transition-delay: 0.08s; } .d2 { transition-delay: 0.16s; } .d3 { transition-delay: 0.24s; }

/* FOOTER */
.page-foot { text-align: center; padding: 48px 32px 64px; }
.page-foot a { font-family: 'Cinzel', serif; font-size: 0.82rem; font-weight: 500; letter-spacing: 0.08em; color: var(--teal-deep); }
.page-foot a:hover { color: var(--terracotta); }

@media (max-width: 768px) {
  body { font-size: 18px; }
  .page-head { padding-top: 48px; }
  .shirts-section h2 { font-size: 2rem; }
  .shirts-grid { grid-template-columns: repeat(2, 1fr); }
  .shirts-grid > .shirt-card:nth-child(1),
  .shirts-grid > .shirt-card:nth-child(2),
  .shirts-grid > .shirt-card:nth-child(n+3) { grid-column: auto; }
}
</style>
</head>
<body>

<header class="page-head">
  <img src="logo-lotus-teal.svg" alt="Salt Spring Centre of Yoga" class="lotus reveal">
  <div class="eyebrow reveal d1">52nd Annual Community Yoga Retreat</div>
</header>

<section class="shirts-section">
  <h2 class="reveal">Retreat Apparel</h2>
  <p class="section-sub reveal">Commemorate the 52nd ACYR.</p>
  <div class="shirts-grid" data-lightbox>
    <div class="shirt-card reveal d1">
      <img src="images/logo-01.jpg" alt="52nd ACYR front design — hands holding a sprout, faith is the ground for yoga to grow" loading="lazy">
      <div class="shirt-label">Front Design</div>
    </div>
    <div class="shirt-card reveal d2">
      <img src="images/logo-02.jpg" alt="52nd ACYR back design — Salt Spring Centre of Yoga lotus mark" loading="lazy">
      <div class="shirt-label">Back Design</div>
    </div>
    <div class="shirt-card reveal d3">
      <img src="images/mens-front.jpg" alt="52nd ACYR men's tee, front" loading="lazy">
      <div class="shirt-label">Men's Tee, Front</div>
    </div>
    <div class="shirt-card reveal d1">
      <img src="images/mens-back.jpg" alt="52nd ACYR men's tee, back" loading="lazy">
      <div class="shirt-label">Men's Tee, Back</div>
    </div>
    <div class="shirt-card reveal d2">
      <img src="images/womens-front.jpg" alt="52nd ACYR women's tee, front" loading="lazy">
      <div class="shirt-label">Women's Tee, Front</div>
    </div>
    <div class="shirt-card reveal d3">
      <img src="images/womens-back.jpg" alt="52nd ACYR women's tee, back" loading="lazy">
      <div class="shirt-label">Women's Tee, Back</div>
    </div>
  </div>
</section>

<footer class="page-foot">
  <a href="https://saltspringcentre.com/acyr.html">Back to the 52nd ACYR &rarr;</a>
</footer>

<script>
var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(e) { if (e.isIntersecting) { e.target.classList.add('in-view'); observer.unobserve(e.target); } });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(function(el){ observer.observe(el); });
</script>
<script src="lightbox.js" defer></script>
</body>
</html>
