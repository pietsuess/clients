<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Your Gift Pack – Between the Mountain and the Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #1a1610; --panel: #241f18; --panel-deep: #16120d; --line: #3a3228;
  --ink: #e8dcc8; --body: #d4c9b8; --dim: #8a7e6e; --gold: #c4a265;
  --gold-hover: #d4b275; --error: #c45c4a;
}
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--body); min-height: 100vh;
}
p, li { text-align: justify; text-align-last: left; text-wrap: pretty; }
.page { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 clamp(20px, 3vw, 48px) 90px; }

.demo-note {
  background: var(--panel-deep); border-bottom: 1px solid var(--line);
  margin: 0 calc(-1 * clamp(20px, 3vw, 48px)); padding: 9px clamp(20px, 3vw, 48px);
  font-size: 12px; color: var(--dim); letter-spacing: 1.5px; text-transform: uppercase;
}

header { text-align: center; padding: 54px 0 10px; }
.film-logo { height: 100px; display: inline-block; }
.tagline {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(22px, 2.6vw, 32px); color: var(--ink);
  margin-top: 24px; line-height: 1.3; letter-spacing: 0.4px;
  text-align: center; text-align-last: center;
}
.sub { color: var(--dim); font-size: 15px; margin-top: 10px; text-align: center; text-align-last: center; }

.pack-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 30px 30px 26px; margin-top: 40px;
}
.pack-card h2 {
  font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500;
  font-size: 28px; color: var(--ink); margin-bottom: 4px;
}
.pack-card .terms { font-size: 13.5px; color: var(--dim); margin-bottom: 22px; }

.field { margin-bottom: 20px; }
.field label { display: block; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.8px; margin-bottom: 7px; }
.field input {
  width: 100%; padding: 12px 15px; font-family: inherit; font-size: 16px;
  background: var(--panel-deep); border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink); outline: none;
}
.field input:focus { border-color: var(--gold); }
.field .why { font-size: 12.5px; color: var(--dim); margin-top: 6px; }

.recips-label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
.recip {
  display: grid; grid-template-columns: 26px 1fr 1.4fr; gap: 10px;
  align-items: center; margin-bottom: 10px;
}
@media (max-width: 560px) {
  .recip { grid-template-columns: 26px 1fr; }
  .recip input[type="email"] { grid-column: 2; }
}
.recip .n {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 20px; color: var(--gold); text-align: center;
}
.recip input {
  width: 100%; padding: 11px 14px; font-family: inherit; font-size: 15px;
  background: var(--panel-deep); border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink); outline: none;
}
.recip input:focus { border-color: var(--gold); }
.recip.sent input { color: var(--dim); border-style: dashed; }
.recip .sent-tag {
  grid-column: 3; display: flex; align-items: center; gap: 7px;
  font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px;
  padding: 0 2px;
}
@media (max-width: 560px) { .recip .sent-tag { grid-column: 2; } }
.recip .sent-tag svg { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.err { font-size: 13px; color: var(--error); margin: 4px 0 14px; display: none; }
.err.show { display: block; }

.send-btn {
  display: block; width: 100%; padding: 16px 0; margin-top: 20px; font-family: inherit;
  font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
  background: var(--gold); color: var(--bg); border: none; border-radius: 8px; cursor: pointer;
}
.send-btn:hover { background: var(--gold-hover); }
.comeback { font-size: 12.5px; color: var(--dim); margin-top: 14px; text-align: center; text-align-last: center; }

.sent-list { list-style: none; margin: 18px 0 6px; }
.sent-list li {
  display: flex; align-items: center; gap: 12px; padding: 11px 0;
  border-bottom: 1px solid var(--line); font-size: 14.5px; color: var(--body);
  text-align: left; text-align-last: left;
}
.sent-list li:last-child { border-bottom: none; }
.sent-list svg { width: 16px; height: 16px; flex: none; color: var(--gold); stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sent-list .addr { color: var(--gold); }
.sent-list .tag { margin-left: auto; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.5px; white-space: nowrap; }

.gift-line { margin-top: 24px; font-size: 13.5px; color: var(--dim); text-align: center; text-align-last: center; }
.gift-line a { color: var(--gold); text-decoration: none; }
.gift-line a:hover { text-decoration: underline; }

footer {
  margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  font-size: 13px; color: var(--dim);
}
</style>
</head>
<body>
<div class="page">
<div class="demo-note">Demo of the gift pack flow. Nothing here sends real email.</div>

<header>
  <img class="film-logo" src="https://images.squarespace-cdn.com/content/v1/667da6b0d213c7409a6c778b/1afd4847-4a0f-4fc5-b1f4-38ca62fca202/BTMATS_FilmTitle_PaleYellowGrain.png" alt="Between the Mountain and the Sky">
  <div class="tagline">Your gift pack</div>
  <p class="sub">Thank you for sharing the film. Tell us where the gifts should go.</p>
</header>

<div class="pack-card" id="pack-card"></div>

<p class="gift-line"><a href="../rent/">Rent or gift another</a> &middot; Questions? <a href="mailto:Hello@MPWRCHANGE.COM">Hello@MPWRCHANGE.COM</a></p>

<footer>
  <span>Between the Mountain and the Sky</span>
  <span>Demo build for the August platform</span>
</footer>
</div>

<script>
(function () {
  var ICONS = {
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
  };
  function icon(key) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[key] + '</svg>';
  }
  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function validEmail(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }

  // Pack size from the confirmation-email link: ?pack=3|5|10, default 3.
  var pack = 3;
  var qp = new URLSearchParams(location.search).get('pack');
  if (qp === '5') pack = 5;
  if (qp === '10') pack = 10;

  var card = document.getElementById('pack-card');

  function loadBatches() {
    try { return JSON.parse(localStorage.getItem('bmats_gift_packs') || '[]'); }
    catch (e) { return []; }
  }
  function saveBatch(batch) {
    var all = loadBatches();
    all.push(batch);
    try { localStorage.setItem('bmats_gift_packs', JSON.stringify(all)); } catch (e) {}
  }

  // Demo stand-in for "which slots are already sent": every recipient in
  // every stored batch counts as a sent slot, deduped by email.
  function sentSoFar() {
    var seen = {}, out = [];
    loadBatches().forEach(function (b) {
      (b.recipients || []).forEach(function (r) {
        var key = String(r.email || '').toLowerCase();
        if (key && !seen[key]) { seen[key] = true; out.push(r); }
      });
    });
    return out;
  }
  function lastBuyerEmail() {
    var all = loadBatches();
    return all.length ? (all[all.length - 1].buyerEmail || '') : '';
  }

  function renderForm() {
    var sent = sentSoFar().slice(0, pack);
    var openSlots = pack - sent.length;

    if (openSlots <= 0) { renderDone([], sent, lastBuyerEmail(), true); return; }

    var html =
      '<h2>Send your ' + pack + ' gifts</h2>' +
      '<p class="terms">Each gift gives one person 7 days of access, unlimited viewings, subtitles in 8 languages. The gift is theirs alone: each recipient gets their own gift email with their own watch link.</p>' +
      '<div class="field">' +
        '<label for="buyer-email">Your email</label>' +
        '<input type="email" id="buyer-email" autocomplete="email" placeholder="you@example.com" value="' + esc(lastBuyerEmail()) + '">' +
        '<div class="why">So you get a copy of every gift email. If one ever goes missing, you can forward it yourself.</div>' +
      '</div>' +
      '<div class="recips-label">Recipients</div>';

    sent.forEach(function (r, i) {
      html +=
        '<div class="recip sent">' +
          '<span class="n">' + (i + 1) + '</span>' +
          '<input type="text" value="' + esc(r.name || '') + '" disabled placeholder="Name">' +
          '<input type="email" value="' + esc(r.email) + '" disabled>' +
          '<span class="sent-tag">' + icon('check') + 'Already sent</span>' +
        '</div>';
    });

    for (var i = 0; i < openSlots; i++) {
      html +=
        '<div class="recip" data-slot="' + i + '">' +
          '<span class="n">' + (sent.length + i + 1) + '</span>' +
          '<input type="text" class="r-name" placeholder="Name (optional)">' +
          '<input type="email" class="r-email" placeholder="their@email.com">' +
        '</div>';
    }

    html +=
      '<p class="err" id="form-err"></p>' +
      '<button class="send-btn" id="send-btn">Send the gifts</button>' +
      '<p class="comeback">You do not have to fill every row today. Come back to this link any time; unsent gifts stay available until you send them.</p>';

    card.innerHTML = html;

    document.getElementById('send-btn').onclick = function () {
      var err = document.getElementById('form-err');
      err.classList.remove('show');

      var buyerField = document.getElementById('buyer-email');
      var buyerEmail = buyerField.value.trim();
      buyerField.style.borderColor = '';
      if (!validEmail(buyerEmail)) {
        buyerField.style.borderColor = 'var(--error)';
        err.textContent = 'We need your email first, so you get a copy of each gift.';
        err.classList.add('show');
        buyerField.focus();
        return;
      }

      var recipients = [];
      var bad = null;
      card.querySelectorAll('.recip[data-slot]').forEach(function (row) {
        var name = row.querySelector('.r-name').value.trim();
        var emailField = row.querySelector('.r-email');
        var email = emailField.value.trim();
        emailField.style.borderColor = '';
        if (!email && !name) return; // untouched slot, stays available
        if (!validEmail(email)) {
          emailField.style.borderColor = 'var(--error)';
          if (!bad) bad = emailField;
          return;
        }
        recipients.push({ name: name, email: email });
      });

      if (bad) {
        err.textContent = 'One of the email addresses does not look right. Please check it.';
        err.classList.add('show');
        bad.focus();
        return;
      }
      if (!recipients.length) {
        err.textContent = 'Add at least one recipient email, or come back later for the rest.';
        err.classList.add('show');
        return;
      }

      // Demo: store locally and show success. Real version posts to the Worker,
      // which sends the gift emails and copies the buyer on each one.
      saveBatch({ buyerEmail: buyerEmail, recipients: recipients, at: new Date().toISOString() });
      renderDone(recipients, sent, buyerEmail, false);
    };
  }

  function renderDone(justSent, alreadySent, buyerEmail, allSentEarlier) {
    var totalSent = alreadySent.length + justSent.length;
    var remaining = pack - totalSent;

    var html = allSentEarlier
      ? '<h2>All ' + pack + ' gifts are on their way</h2>' +
        '<p class="terms">Every gift in this pack has been sent. Each recipient got their own gift email with their own watch link, and a copy of every one went to you' +
        (buyerEmail ? ' at <b style="color:var(--gold)">' + esc(buyerEmail) + '</b>' : '') +
        ', so you can always forward it yourself.</p>'
      : '<h2>' + (justSent.length === 1 ? 'Gift on its way' : 'Gifts on their way') + '</h2>' +
        '<p class="terms">Each person below gets their own gift email with their own watch link: 7 days of access, unlimited viewings, subtitles in 8 languages. A copy of every gift email goes to <b style="color:var(--gold)">' + esc(buyerEmail) + '</b>, so you can always forward one yourself.</p>';

    html += '<ul class="sent-list">';
    alreadySent.forEach(function (r) {
      html += '<li>' + icon('check') +
        '<span>' + (r.name ? esc(r.name) + ', ' : '') + '<span class="addr">' + esc(r.email) + '</span></span>' +
        '<span class="tag">Sent earlier</span></li>';
    });
    justSent.forEach(function (r) {
      html += '<li>' + icon('mail') +
        '<span>' + (r.name ? esc(r.name) + ', ' : '') + '<span class="addr">' + esc(r.email) + '</span></span>' +
        '<span class="tag">Sent</span></li>';
    });
    html += '</ul>';

    if (remaining > 0) {
      html += '<p class="comeback">' + remaining + (remaining === 1 ? ' gift is' : ' gifts are') +
        ' still unsent. Come back to this link whenever you are ready and the open slots will be waiting.</p>' +
        '<button class="send-btn" id="more-btn">Send another now</button>';
    } else if (!allSentEarlier) {
      html += '<p class="comeback">That is the whole pack. Thank you for sharing the film.</p>';
    }

    card.innerHTML = html;
    var more = document.getElementById('more-btn');
    if (more) more.onclick = renderForm;
  }

  renderForm();
})();
</script>
</body>
</html>
